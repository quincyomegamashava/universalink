{% extends "portal/base.html" %}
{% block title %}Password · {{ app_name }}{% endblock %}
{% block content %}
<h1>Change password</h1>
<p class="muted">Updates the password for chat, settings, and (if you are an admin) the console.</p>

<form class="panel max-w-form" method="post" action="/settings/password">
  <label class="field">
    Current password
    <input type="password" name="current_password" required minlength="8" autocomplete="current-password" />
  </label>
  <label class="field">
    New password
    <input type="password" name="new_password" required minlength="8" autocomplete="new-password" />
  </label>
  <label class="field">
    Confirm new password
    <input type="password" name="confirm_password" required minlength="8" autocomplete="new-password" />
  </label>
  <button class="btn" type="submit">Update password</button>
</form>
{% endblock %}
