<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create account · {{ app_name }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/admin/static/admin.css?v={{ css_version }}" />
</head>
<body>
  <div class="login-page portal-page">
    <form class="login-card" method="post" action="/register">
      <p class="eyebrow">{{ app_name }}</p>
      <h1>Join {{ app_name }}</h1>
      <p>One account for chat and developer API access.</p>
      {% if error %}<div class="error">{{ error }}</div>{% endif %}
      <label class="field">
        Name
        <input type="text" name="name" value="{{ name or '' }}" required maxlength="200" autocomplete="name" />
      </label>
      <label class="field">
        Email
        <input type="email" name="email" value="{{ email or '' }}" required autocomplete="username" />
      </label>
      <label class="field">
        Password
        <input type="password" name="password" required minlength="8" autocomplete="new-password" />
      </label>
      <button class="btn" type="submit">Create account</button>
      <p class="muted portal-foot">Already have an account? <a href="/login">Sign in</a></p>
    </form>
  </div>
</body>
</html>
