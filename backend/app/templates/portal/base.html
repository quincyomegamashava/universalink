<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}{{ app_name }}{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/admin/static/admin.css?v={{ css_version }}" />
</head>
<body>
  <div class="layout portal-layout">
    <aside class="sidebar">
      <div class="brand">
        {{ app_name }}
        <span>Account · {{ user.email }}</span>
      </div>
      <nav class="nav">
        <a href="/home" class="{% if active == 'home' %}active{% endif %}">Home</a>
        <a href="/">Open chat</a>
        <a href="/settings/api-keys" class="{% if active == 'api-keys' %}active{% endif %}">API keys</a>
        <a href="/settings/password" class="{% if active == 'password' %}active{% endif %}">Password</a>
        {% if user.role == 'admin' %}
        <a href="/admin/">Admin console</a>
        {% endif %}
      </nav>
      <form class="sidebar-foot" method="post" action="/logout">
        <button class="btn secondary" type="submit">Sign out</button>
      </form>
    </aside>
    <main class="content">
      {% if flash %}<div class="flash ok">{{ flash }}</div>{% endif %}
      {% if error %}<div class="flash err">{{ error }}</div>{% endif %}
      {% block content %}{% endblock %}
    </main>
  </div>
</body>
</html>
