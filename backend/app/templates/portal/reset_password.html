<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset password · {{ app_name }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/admin/static/admin.css?v={{ css_version }}" />
</head>
<body>
  <div class="login-page portal-page">
    {% if valid %}
    <form class="login-card" method="post" action="/reset-password">
      <p class="eyebrow">{{ app_name }}</p>
      <h1>Choose a new password</h1>
      <p>This link expires one hour after it was issued.</p>
      {% if error %}<div class="error">{{ error }}</div>{% endif %}
      <input type="hidden" name="token" value="{{ token }}" />
      <label class="field">
        New password
        <input type="password" name="new_password" required minlength="8" autocomplete="new-password" />
      </label>
      <label class="field">
        Confirm password
        <input type="password" name="confirm_password" required minlength="8" autocomplete="new-password" />
      </label>
      <button class="btn" type="submit">Reset password</button>
    </form>
    {% else %}
    <div class="login-card">
      <p class="eyebrow">{{ app_name }}</p>
      <h1>Link expired</h1>
      {% if error %}<div class="error">{{ error }}</div>{% endif %}
      <p class="muted portal-foot"><a href="/forgot-password">Request a new link</a> · <a href="/login">Sign in</a></p>
    </div>
    {% endif %}
  </div>
</body>
</html>
