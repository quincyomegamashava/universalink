global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: ai-backend
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8000"]

  - job_name: nginx
    static_configs:
      - targets: ["nginx:80"]
    metrics_path: /nginx-health
    # Prefer nginx-prometheus-exporter in a hardened deploy; health scrape is a placeholder probe.
