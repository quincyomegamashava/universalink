# Phase 1 smoke-test NGINX (no SSO). Use only for GPU/Ollama bring-up:
#   docker compose -f docker-compose.yml -f compose.phase1.yml up -d
#
# Production / shared installs should use the default conf (platform SSO).

upstream open_webui {
    server open-webui:8080;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    location /nginx-health {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    location / {
        proxy_pass http://open_webui;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_cache off;
    }
}
