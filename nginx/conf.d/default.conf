# Production NGINX: platform SSO → Open WebUI via trusted headers.
# Ollama is NOT proxied publicly — backend reaches it on the Docker network only.
#
# Auth flow:
#   Browser → /login (Postgres users) → cookie → auth_request /auth/verify
#   → X-User-* headers → Open WebUI (no separate chat password)
#
# Local/dev: this HTTP server serves the full app (compose maps 8088:80).
# Production TLS: scripts/enable-https.sh installs https.conf and switches
# this file to redirect-only HTTP (see default-http-redirect.conf).

upstream open_webui {
    server open-webui:8080;
    keepalive 32;
}

upstream backend_api {
    server backend:8000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Keep redirects relative so host:8088 (and other non-80 ports) are preserved
    absolute_redirect off;

    include /etc/nginx/conf.d/app-locations.inc;
}
