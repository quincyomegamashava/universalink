# Phase 1 base stack: Ollama + Open WebUI + NGINX
# GPU: docker compose -f docker-compose.yml -f compose.gpu.yml up -d
# Full platform: docker compose --profile full up -d

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ai-ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=${OLLAMA_HOST:-0.0.0.0}
      # Keep weights in memory (-1 = forever) so prompts don't pay cold-load cost
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE:--1}
      - OLLAMA_NUM_PARALLEL=${OLLAMA_NUM_PARALLEL:-1}
      - OLLAMA_MAX_LOADED_MODELS=${OLLAMA_MAX_LOADED_MODELS:-1}
    networks:
      - ai_net
    # Intentionally NOT publishing 11434 to the host/public internet
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: ai-open-webui
    restart: unless-stopped
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY:-change-me}
      - WEBUI_NAME=${WEBUI_NAME:-AI Platform}
      # Platform owns signup/login; Open WebUI trusts NGINX identity headers only
      - ENABLE_SIGNUP=false
      - ENABLE_LOGIN_FORM=false
      - WEBUI_AUTH_TRUSTED_EMAIL_HEADER=X-User-Email
      - WEBUI_AUTH_TRUSTED_NAME_HEADER=X-User-Name
      - WEBUI_AUTH_TRUSTED_ROLE_HEADER=X-User-Role
      # Show all Ollama models to every signed-in user (no per-model ACL gating)
      - BYPASS_MODEL_ACCESS_CONTROL=true
    volumes:
      - open_webui_data:/app/backend/data
    networks:
      - ai_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  nginx:
    image: nginx:1.27-alpine
    container_name: ai-nginx
    restart: unless-stopped
    depends_on:
      open-webui:
        condition: service_started
      backend:
        condition: service_healthy
        required: false
    ports:
      - "8088:80"
      - "8443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certs:/etc/nginx/certs:ro
    networks:
      - ai_net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/nginx-health"]
      interval: 20s
      timeout: 5s
      retries: 3

  # --- Full stack (Phase 2+) — enable with: --profile full ---

  postgres:
    profiles: ["full"]
    image: postgres:16-alpine
    container_name: ai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aiplatform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-strong-db-password}
      POSTGRES_DB: ${POSTGRES_DB:-aiplatform}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ai_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aiplatform} -d ${POSTGRES_DB:-aiplatform}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    profiles: ["full"]
    image: redis:7-alpine
    container_name: ai-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - ai_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    profiles: ["full"]
    image: qdrant/qdrant:v1.12.5
    container_name: ai-qdrant
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - ai_net

  backend:
    profiles: ["full"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy
      qdrant:
        condition: service_started
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      UPLOAD_DIR: /data/uploads
      AGENT_WORKSPACE_DIR: /data/agent-workspace
    volumes:
      - upload_data:/data/uploads
      - agent_workspace:/data/agent-workspace
    networks:
      - ai_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 40s

  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:v2.55.1
    container_name: ai-prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - ai_net

  grafana:
    profiles: ["monitoring"]
    image: grafana/grafana:11.3.1
    container_name: ai-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-change-me-grafana}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
    networks:
      - ai_net

networks:
  ai_net:
    driver: bridge
    name: ai_net

volumes:
  ollama_data:
  open_webui_data:
  postgres_data:
  redis_data:
  qdrant_data:
  upload_data:
  agent_workspace:
  prometheus_data:
  grafana_data:
